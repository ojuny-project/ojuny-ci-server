name: update flake inputs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Check for a flake
        id: flake
        run: |
          if [ ! -f flake.nix ]; then
            echo "No flake.nix in this repository yet." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31.9.1
        if: steps.flake.outputs.present == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update every input
        if: steps.flake.outputs.present == 'true'
        id: update
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- flake.lock >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Evaluate the updated lock
        if: steps.flake.outputs.present == 'true' && steps.update.outputs.changed == 'true'
        run: nix flake check --no-build

      - name: Push the update branch
        if: steps.flake.outputs.present == 'true' && steps.update.outputs.changed == 'true'
        id: branch
        run: |
          branch="flake-update/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.lock
          git commit -m "flake.lock: update every input"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        if: steps.flake.outputs.present == 'true' && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "update flake inputs" \
            --body "Updates every input with \`nix flake update\`. The lock passed \`nix flake check --no-build\`. Merge this pull request, then rebuild."; then
            exit 0
          fi
          echo "Open the pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
